<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Hồ sơ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-light bg-white mb-4"><div class="container"><a class="navbar-brand" href="index.html">Trang chủ</a></div></nav>
    <div class="container">
        <h2 class="mb-4">Quản lý tài khoản</h2>
        <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
            <li class="nav-item"><button class="nav-link active rounded-pill" data-bs-toggle="pill" data-bs-target="#orders">Đơn hàng</button></li>
            <li class="nav-item"><button class="nav-link rounded-pill" data-bs-toggle="pill" data-bs-target="#employee">Nhân viên (DN)</button></li>
        </ul>
        <div class="tab-content p-4 bg-white shadow rounded">
            <div class="tab-pane fade show active" id="orders">
                <h5 class="text-warning">Chờ xác nhận</h5><div id="pending-orders"></div>
                <hr><h5 class="text-success">Đang hiệu lực</h5><div id="active-orders"></div>
            </div>
            <div class="tab-pane fade" id="employee">
                <div id="enterprise-only" class="d-none">
                     <form id="add-emp" class="d-flex gap-2 mb-3">
                         <input id="empName" class="form-control" placeholder="Tên NV">
                         <input id="empPhone" class="form-control" placeholder="SĐT">
                         <button class="btn btn-primary">Thêm</button>
                     </form>
                     <ul id="emp-list" class="list-group"></ul>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        // Logic loadOrders và loadEmployees (Copy từ bài trước vào đây là chạy)
        async function loadOrders() {
            const data = await fetchAPI('/orders/history/');
            const render = (list) => list.map(o => `<div class="alert alert-light border mb-2 d-flex justify-content-between">
                <span><b>${o.code}</b> - ${formatMoney(o.total_amount)}</span> <span class="badge bg-secondary">${o.status}</span>
            </div>`).join('');
            document.getElementById('pending-orders').innerHTML = render(data.pending);
            document.getElementById('active-orders').innerHTML = render(data.active);
        }
        // ... (Logic employee giữ nguyên)
        loadOrders();
        // Check role Enterprise để hiện tab employee
        const u = getUser();
        if(u && (u.user_type === 'enterprise' || u.company_name)) {
            document.getElementById('enterprise-only').classList.remove('d-none');
            // Gọi loadEmployees()...
        }
    </script>
</body>
</html>
