<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: #fff;
        }
        .btn-custom {
            background-color: #d71920; /* Màu đỏ TIS */
            color: white;
        }
        .btn-custom:hover { background-color: #b01218; color: white; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <img src="images/logo.png" alt="Logo" height="60" class="mb-3">
            <h4 class="fw-bold">Đăng Nhập</h4>
            <p class="text-muted small">Hệ thống quản trị TIS Admin</p>
        </div>

        <div id="error-message" class="alert alert-danger d-none text-center p-2 small"></div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label fw-bold">Tài khoản (SĐT)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Nhập số điện thoại" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <button type="submit" class="btn btn-custom w-100 py-2 fw-bold" id="btn-login">
                ĐĂNG NHẬP
            </button>
        </form>
        
        <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none small text-secondary">
                ← Quay lại trang chủ
            </a>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
