<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác minh email - TIS Broker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-banner">
            <div id="banner-slideshow" class="banner-slideshow"></div>
            <div class="auth-banner-overlay">
                <h1>Xác minh tài khoản<br>TIS Broker</h1>
                <p>Nhập OTP trong email hoặc mở link xác minh để kích hoạt tài khoản.</p>
            </div>
        </div>

        <div class="auth-form-area">
            <div class="mb-5 text-center">
                <img src="images/logo.png" alt="TIS Logo" class="auth-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x60/d71920/ffffff?text=TIS+BROKER';">
                <h3 class="fw-bold text-dark m-0 mt-3">Xác minh email</h3>
                <p class="text-muted mt-1">Tài khoản chỉ có hiệu lực sau khi xác minh.</p>
            </div>

            <form id="verify-email-form">
                <div class="mb-3">
                    <label class="fw-bold small mb-1">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Email đã đăng ký" required>
                </div>
                <div class="mb-4">
                    <label class="fw-bold small mb-1">Mã OTP</label>
                    <input type="text" id="otp" class="form-control" maxlength="6" placeholder="Nhập 6 số OTP">
                </div>
                <button type="submit" id="btn-verify" class="btn btn-primary w-100 p-3 fw-bold">XÁC MINH</button>
                <button type="button" id="btn-resend" class="btn btn-outline-danger w-100 p-3 fw-bold mt-3">Gửi lại mã</button>
                <div class="text-center mt-4">
                    <a href="login.html" class="text-danger text-decoration-none fw-bold">Quay lại đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/common.js"></script>
    <script src="js/auth-banner.js"></script>
    <script src="js/verify-email.js"></script>
</body>
</html>
