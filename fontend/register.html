<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .input-group-text { background-color: white; border-left: none; cursor: pointer; }
        .input-group-text:hover { color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card shadow-lg animate__animated animate__fadeInUp" style="max-width: 600px;">
            <div class="text-center mb-4">
                <a href="index.html">
                    <img src="images/logo.png" alt="TIS Logo" style="height: 50px;">
                </a>
                <h4 class="mt-3 fw-bold text-secondary">Đăng ký thành viên</h4>
            </div>

            <form id="register-form">
                <div class="row mb-3">
                    <div class="col-12">
                        <label class="auth-label">Loại tài khoản</label>
                        <select id="user_type" class="form-select auth-input">
                            <option value="individual">Cá nhân</option>
                            <option value="enterprise">Doanh nghiệp</option>
                        </select>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="auth-label">Họ và tên / Người đại diện</label>
                        <input type="text" id="full_name" class="form-control auth-input" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="auth-label">Số điện thoại</label>
                        <input type="text" id="phone" class="form-control auth-input" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="auth-label">Mật khẩu</label>
                        <input type="password" id="password" class="form-control auth-input" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="auth-label">Nhập lại mật khẩu</label>
                        <input type="password" id="confirm_password" class="form-control auth-input" required>
                    </div>
                </div>

                <div id="biz-fields" class="d-none p-4 bg-light border rounded-3 mb-3 animate__animated animate__fadeIn">
                    <h6 class="text-primary fw-bold mb-3"><i class="fas fa-building me-1"></i> Thông tin Doanh nghiệp</h6>
                    
                    <div class="mb-3">
                        <label class="auth-label">Mã số thuế <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="text" id="tax_code" class="form-control auth-input border-end-0" placeholder="Nhập MST (Ví dụ: 0101248141)">
                            <span class="input-group-text border-start-0" id="btn-search-mst" title="Bấm để tra cứu">
                                <i class="fas fa-search" id="mst-icon"></i>
                                <span class="spinner-border spinner-border-sm text-primary d-none" id="mst-loading"></span>
                            </span>
                        </div>
                        <small class="text-muted fst-italic">Nhập MST và bấm ra ngoài để tự động lấy thông tin.</small>
                    </div>

                    <div class="mb-3">
                        <label class="auth-label">Tên Công ty</label>
                        <input type="text" id="company_name" class="form-control auth-input" placeholder="Tự động điền..." readonly>
                    </div>

                    <div class="mb-0">
                        <label class="auth-label">Địa chỉ trụ sở</label>
                        <textarea id="biz_address" class="form-control auth-input" rows="2" placeholder="Tự động điền..."></textarea>
                    </div>
                </div>

                <div id="ind-fields" class="mb-3 animate__animated animate__fadeIn">
                    <label class="auth-label">CCCD (Không bắt buộc)</label>
                    <input type="text" id="cccd" class="form-control auth-input">
                    <div class="mt-3">
                        <label class="auth-label">Địa chỉ thường trú</label>
                        <input type="text" id="ind_address" class="form-control auth-input">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill shadow mt-2 fw-bold">Đăng ký ngay</button>
            </form>
            
            <div class="mt-4 text-center">
                <p class="small">Đã có tài khoản? <a href="login.html" class="fw-bold text-decoration-none">Đăng nhập</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
