<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Admin - TIS Broker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-banner">
            <div id="banner-slideshow" class="banner-slideshow"></div>
            <div class="auth-banner-overlay">
                <h1>TIS Admin Portal</h1>
                <p>Không gian quản trị dành cho đội ngũ nội bộ TIS Broker.</p>
                <div class="mt-4"><i class="fas fa-check-circle text-success me-2"></i> Kiểm soát đơn hàng và thanh toán</div>
                <div class="mt-2"><i class="fas fa-check-circle text-success me-2"></i> Theo dõi hỗ trợ khách hàng tập trung</div>
            </div>
        </div>

        <div class="auth-form-area">
            <div class="mb-5 text-center">
                <img src="images/logo.png" alt="TIS Logo" class="auth-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x60/d71920/ffffff?text=TIS+BROKER';">
                <h3 class="fw-bold text-dark m-0 mt-3">Đăng nhập Admin / Staff</h3>
                <p class="text-muted mt-1">Vui lòng dùng tài khoản nội bộ được cấp quyền</p>
            </div>

            <form id="login-form" data-login-scope="internal">
                <div class="mb-3">
                    <label class="fw-bold small mb-1">Số điện thoại</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user-shield text-muted"></i></span>
                        <input type="tel" id="phone" class="form-control border-start-0 ps-0" placeholder="Nhập số điện thoại nội bộ" inputmode="tel" autocomplete="tel" pattern="^(\+84|84|0)(3|5|7|8|9)[0-9]{8}$" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="fw-bold small mb-1">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" id="password" class="form-control border-start-0 border-end-0 ps-0" placeholder="Mật khẩu của bạn" required>
                        <span class="input-group-text bg-white cursor-pointer toggle-password" data-target="password"><i class="fas fa-eye text-muted"></i></span>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="forgot-password.html?next=admin-login.html" class="small text-danger text-decoration-none fw-bold">Quên mật khẩu?</a>
                    <a href="login.html" class="small text-muted text-decoration-none fw-semibold">Đăng nhập khách hàng</a>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary w-100 p-3 fw-bold">ĐĂNG NHẬP NỘI BỘ</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/common.js"></script>
    <script src="js/auth-banner.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
