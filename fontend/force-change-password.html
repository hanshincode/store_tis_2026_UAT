<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Doi mat khau - TIS Broker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-banner">
            <div id="banner-slideshow" class="banner-slideshow"></div>
            <div class="auth-banner-overlay">
                <h1>Cap nhat mat khau<br>TIS Broker</h1>
                <p>Vui long dat mat khau moi de bao ve tai khoan cua ban.</p>
            </div>
        </div>

        <div class="auth-form-area">
            <div class="mb-5 text-center">
                <img src="images/logo.png" alt="TIS Logo" class="auth-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x60/d71920/ffffff?text=TIS+BROKER';">
                <h3 class="fw-bold text-dark m-0 mt-3">Doi mat khau lan dau</h3>
                <p class="text-muted mt-1">Nhap mat khau tam thoi trong email va tao mat khau moi.</p>
            </div>

            <form id="force-password-form">
                <div class="mb-3">
                    <label class="fw-bold small mb-1">Mat khau tam thoi</label>
                    <input type="password" id="current_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small mb-1">Mat khau moi</label>
                    <input type="password" id="new_password" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="fw-bold small mb-1">Xac nhan mat khau moi</label>
                    <input type="password" id="confirm_password" class="form-control" required>
                </div>
                <button type="submit" id="btn-force-password" class="btn btn-primary w-100 p-3 fw-bold">LUU MAT KHAU MOI</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/common.js"></script>
    <script src="js/auth-banner.js"></script>
    <script src="js/force-change-password.js"></script>
</body>
</html>
