<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Giỏ hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-light fixed-top"><div class="container"><a class="navbar-brand" href="index.html">← Tiếp tục mua sắm</a></div></nav>
    <div class="container mt-5 pt-5">
        <h3 class="mb-4 animate__animated animate__fadeInLeft">Giỏ hàng của bạn</h3>
        <div class="card shadow p-3 animate__animated animate__fadeInUp">
            <div id="cart-container"></div>
            <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-light rounded">
                <h4 class="m-0">Tổng: <span id="total-price" class="text-danger fw-bold">0 đ</span></h4>
                <button onclick="checkout()" class="btn btn-primary btn-lg rounded-pill px-5 shadow">Thanh toán</button>
            </div>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script>
        // Paste logic loadCart, updateQty, checkout từ câu trả lời cũ vào đây
        // Hoặc viết lại ngắn gọn:
        async function loadCart() {
             const data = await fetchAPI('/cart/');
             const list = document.getElementById('cart-container');
             if (!data || data.items.length === 0) {
                 list.innerHTML = '<p class="text-center text-muted">Giỏ trống</p>';
                 document.getElementById('total-price').innerText = '0 đ';
                 return;
             }
             document.getElementById('total-price').innerText = formatMoney(data.total_price);
             list.innerHTML = `<table class="table table-hover">
                 <thead class="table-light"><tr><th>Sản phẩm</th><th>Giá</th><th>SL</th><th></th></tr></thead>
                 <tbody>${data.items.map(i => `
                     <tr>
                         <td>${i.product_name}<br><small class="text-muted">${i.duration}</small></td>
                         <td>${formatMoney(i.price)}</td>
                         <td><input type="number" style="width:60px" value="${i.quantity}" onchange="updateQty(${i.id}, this.value)"></td>
                         <td><button class="btn btn-sm btn-outline-danger" onclick="updateQty(${i.id}, 0)"><i class="fas fa-trash"></i></button></td>
                     </tr>`).join('')}</tbody></table>`;
        }
        async function updateQty(id, qty) { await fetchAPI('/cart/update_item/', 'POST', { item_id: id, quantity: qty }); loadCart(); }
        async function checkout() { 
            if(confirm('Thanh toán ngay?')) {
                const cart = await fetchAPI('/cart/');
                for(let i of cart.items) await fetchAPI('/orders/buy_now/', 'POST', { package_id: i.package, quantity: i.quantity });
                alert("Thành công!"); location.href='profile.html';
            }
        }
        loadCart();
    </script>
</body>
</html>
