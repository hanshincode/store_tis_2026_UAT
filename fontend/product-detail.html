<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Sản phẩm - TIS Broker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .main-image-wrapper { height: 450px; background: #f8f9fa; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #eee; position: relative; }
        .main-image-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .thumbnail-img { height: 80px; width: 100%; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .thumbnail-img.active { border-color: var(--primary-color); }
        .duration-btn { border: 1px solid #dee2e6; border-radius: 8px; padding: 8px 15px; cursor: pointer; transition: 0.2s; background: white; }
        .duration-btn.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .provider-badge { position: absolute; top: 20px; right: 20px; z-index: 10; display: none; } /* Mặc định ẩn */
    </style>
</head>
<body class="bg-light">
    <header id="header-placeholder"></header>

    <div class="container" style="margin-top: 100px;">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted">Trang chủ</a></li>
                <li class="breadcrumb-item active text-danger fw-bold" id="breadcrumb-name">Chi tiết sản phẩm</li>
            </ol>
        </nav>

        <main id="product-detail-container">
            <div class="text-center py-5">
                <div class="spinner-border text-danger"></div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="consultationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Yêu cầu tư vấn bảo hiểm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="consultation-form">
                        <div class="mb-3">
                            <label class="small fw-bold">Họ và Tên</label>
                            <input type="text" id="consult-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="small fw-bold">Số điện thoại / Email</label>
                            <input type="text" id="consult-contact" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="small fw-bold">Ghi chú thêm (nếu có)</label>
                            <textarea id="consult-note" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 p-3 fw-bold">GỬI YÊU CẦU</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer id="footer-placeholder"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/product-detail.js"></script>
</body>
</html>
