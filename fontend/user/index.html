<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - TIS Broker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div id="header-placeholder"></div>

    <main class="container pb-5 user-page-main">
        <div class="profile-hero mb-4">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="profile-avatar" id="profile-avatar">U</div>
                    <div>
                        <div class="text-white-50 small mb-1">Hồ sơ khách hàng</div>
                        <h1 class="h3 fw-bold text-white mb-1" id="profile-name">Đang tải...</h1>
                        <div class="text-white-50" id="profile-phone">--</div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <a href="orders.html" class="btn btn-light rounded-pill px-4">
                        <i class="fas fa-file-invoice-dollar me-2"></i>Đơn hàng
                    </a>
                    <a href="chat.html" class="btn btn-outline-light rounded-pill px-4">
                        <i class="fas fa-headset me-2"></i>Hỗ trợ
                    </a>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="profile-stat">
                    <span class="profile-stat-icon bg-danger-subtle text-danger"><i class="fas fa-shopping-cart"></i></span>
                    <div><div class="text-muted small">Giỏ hàng</div><div class="h4 fw-bold mb-0" id="stat-cart">0</div></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="profile-stat">
                    <span class="profile-stat-icon bg-success-subtle text-success"><i class="fas fa-file-contract"></i></span>
                    <div><div class="text-muted small">Đơn hàng</div><div class="h4 fw-bold mb-0" id="stat-orders">0</div></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="profile-stat">
                    <span class="profile-stat-icon bg-warning-subtle text-warning"><i class="fas fa-comments"></i></span>
                    <div><div class="text-muted small">Yêu cầu hỗ trợ</div><div class="h4 fw-bold mb-0" id="stat-consultations">0</div></div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <section class="profile-panel h-100">
                    <h5 class="fw-bold mb-4">Thông tin tài khoản</h5>
                    <div class="profile-info-list">
                        <div><span>Số điện thoại đăng nhập</span><strong id="info-phone">--</strong></div>
                        <div><span>Tên hiển thị</span><strong id="info-username">--</strong></div>
                        <div><span>Loại khách hàng</span><strong id="info-user-type">--</strong></div>
                        <div><span>Email</span><strong id="info-email">--</strong></div>
                        <div id="company-info-row" class="d-none"><span>Doanh nghiệp</span><strong id="info-company">--</strong></div>
                    </div>
                </section>
            </div>

            <div class="col-lg-7">
                <section class="profile-panel">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold mb-0">Cập nhật thông tin</h5>
                        <span class="badge bg-light text-dark border">Khách hàng</span>
                    </div>

                    <form id="profile-form" class="row g-3">
                        <div class="col-md-6"><label class="form-label small fw-bold">Họ</label><input type="text" class="form-control" id="last_name" placeholder="Nguyễn"></div>
                        <div class="col-md-6"><label class="form-label small fw-bold">Tên</label><input type="text" class="form-control" id="first_name" placeholder="An"></div>
                        <div class="col-md-6"><label class="form-label small fw-bold">Email</label><input type="email" class="form-control" id="email" placeholder="email@example.com"></div>
                        <div class="col-md-6"><label class="form-label small fw-bold">Tên công ty</label><input type="text" class="form-control" id="company_name" placeholder="Dành cho tài khoản doanh nghiệp"></div>
                        <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                            <button type="button" class="btn btn-outline-secondary rounded-pill px-4" id="btn-reset-profile">Hủy</button>
                            <button type="submit" class="btn btn-danger rounded-pill px-4" id="btn-save-profile"><i class="fas fa-save me-2"></i>Lưu thay đổi</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>

        <section class="profile-panel mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Bảo hiểm doanh nghiệp cấp</h5>
                <span class="badge bg-danger-subtle text-danger" id="coverage-count">0 quyền lợi</span>
            </div>
            <div id="company-coverages" class="row g-3"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/common.js"></script>
    <script src="../js/layout.js"></script>
    <script src="js/core.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
