<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm - TIS Insurance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
</head>
<body class="bg-light">

    <div id="header-placeholder"></div>

    <div class="container-fluid bg-white py-4 shadow-sm mb-4 border-bottom position-relative overflow-hidden">
        <div class="container position-relative z-1">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted">Trang chủ</a></li>
                    <li class="breadcrumb-item active text-danger fw-bold" aria-current="page">Sản phẩm</li>
                </ol>
            </nav>
            <h2 class="fw-bold mt-2">Giải pháp bảo hiểm toàn diện</h2>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-lg-3 d-none d-lg-block">
                <div class="product-filter-panel sticky-top product-filter-stack">
                    <div class="filter-panel-head">
                        <div>
                            <div class="filter-eyebrow">Bộ lọc</div>
                            <h5>Chọn gói phù hợp</h5>
                        </div>
                        <button type="button" class="btn-reset-filter" onclick="resetProductFilters()" title="Xóa bộ lọc">
                            <i class="fas fa-rotate-left"></i>
                        </button>
                    </div>

                    <section class="filter-block">
                        <div class="filter-block-title">
                            <i class="fas fa-grid-2"></i>
                            <span>Danh mục sản phẩm</span>
                        </div>
                        <div class="filter-chip-list" id="category-list-container">
                            <button class="filter-chip muted" type="button"><i class="fas fa-spinner fa-spin"></i> Đang tải...</button>
                        </div>
                    </section>

                    <section class="filter-block">
                        <div class="filter-block-title">
                            <i class="fas fa-user-shield"></i>
                            <span>Đối tượng</span>
                        </div>
                        <div class="filter-segment" id="target-list-container"></div>
                    </section>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="d-lg-none mb-3">
                    <button class="btn btn-danger w-100 rounded-pill py-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCategory">
                        <i class="fas fa-filter me-2"></i> Lọc sản phẩm
                    </button>
                </div>

                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 bg-white p-3 rounded-3 shadow-sm border">
                    <h5 class="fw-bold m-0 mb-2 mb-md-0 text-dark ps-2 border-start border-4 border-danger" id="product-filter-title">
                        Tất cả sản phẩm
                    </h5>
                    <div class="d-flex gap-2 w-100 w-md-auto product-search-box">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" id="product-search-input" class="form-control border-start-0 ps-0" placeholder="Tìm kiếm gói bảo hiểm..." oninput="searchProducts(this.value)">
                        </div>
                    </div>
                </div>

                <div id="product-list" class="row g-3">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-danger" role="status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasCategory">
        <div class="offcanvas-header product-filter-offcanvas-head">
            <h5 class="offcanvas-title fw-bold">Lọc sản phẩm</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <section class="filter-block">
                <div class="filter-block-title">
                    <i class="fas fa-grid-2"></i>
                    <span>Danh mục sản phẩm</span>
                </div>
                <div class="filter-chip-list" id="category-list-mobile"></div>
            </section>

            <section class="filter-block mt-4">
                <div class="filter-block-title">
                    <i class="fas fa-user-shield"></i>
                    <span>Đối tượng</span>
                </div>
                <div class="filter-segment" id="target-list-mobile"></div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
