<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cap nhat thong tin - TIS Broker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-banner">
            <div id="banner-slideshow" class="banner-slideshow"></div>
            <div class="auth-banner-overlay">
                <h1>Cap nhat thong tin<br>TIS Broker</h1>
                <p>Hoan tat thong tin theo yeu cau de TIS tao tai khoan va ho tro nhanh hon.</p>
            </div>
        </div>

        <div class="auth-form-area">
            <div class="mb-4 text-center">
                <img src="images/logo.png" alt="TIS Logo" class="auth-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x60/d71920/ffffff?text=TIS+BROKER';">
                <h3 class="fw-bold text-dark m-0 mt-3">Form cap nhat nhanh</h3>
                <p class="text-muted mt-1" id="quick-form-subtitle">Dang tai form...</p>
            </div>

            <div id="quick-form-message"></div>
            <form id="quick-customer-form" style="display:none">
                <div class="mb-3">
                    <label class="fw-bold small mb-1">Ho ten</label>
                    <input type="text" id="customer_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small mb-1">So dien thoai <span class="text-danger">*</span></label>
                    <input type="tel" id="phone" class="form-control" inputmode="tel" autocomplete="tel" required>
                </div>
                <div class="mb-3">
                    <label class="fw-bold small mb-1">Email nhan mat khau <span class="text-danger">*</span></label>
                    <input type="email" id="email" class="form-control" autocomplete="email" required>
                </div>
                <div id="quick-dynamic-fields"></div>
                <button type="submit" id="btn-submit-quick-form" class="btn btn-primary w-100 p-3 fw-bold mt-3">GUI THONG TIN</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/common.js"></script>
    <script src="js/auth-banner.js"></script>
    <script src="js/quick-form.js"></script>
</body>
</html>
