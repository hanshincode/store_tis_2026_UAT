<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - TIS Broker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-banner">
            <div id="banner-slideshow" class="banner-slideshow"></div>
            <div class="auth-banner-overlay">
                <h1>Khôi phục mật khẩu<br>TIS Broker</h1>
                <p>Nhập số điện thoại hoặc email, hệ thống sẽ gửi OTP/link khôi phục vào email đã đăng ký.</p>
            </div>
        </div>

        <div class="auth-form-area">
            <div class="mb-5 text-center">
                <img src="images/logo.png" alt="TIS Logo" class="auth-logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x60/d71920/ffffff?text=TIS+BROKER';">
                <h3 class="fw-bold text-dark m-0 mt-3">Quên mật khẩu</h3>
                <p class="text-muted mt-1">Kiểm tra email sau khi gửi yêu cầu.</p>
            </div>

            <form id="forgot-password-form">
                <div class="mb-4">
                    <label class="fw-bold small mb-1">Số điện thoại hoặc email</label>
                    <input type="text" id="email_or_phone" class="form-control" placeholder="Nhập số điện thoại hoặc email" required>
                </div>
                <button type="submit" id="btn-forgot" class="btn btn-primary w-100 p-3 fw-bold">GỬI EMAIL KHÔI PHỤC</button>
                <div class="text-center mt-4">
                    <a href="login.html" class="text-danger text-decoration-none fw-bold">Quay lại đăng nhập</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/common.js"></script>
    <script src="js/auth-banner.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
