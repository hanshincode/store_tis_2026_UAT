<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TIS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="main-content">
        <div class="container-fluid admin-dashboard p-4">
            <div class="dashboard-heading mb-4">
                <h4 class="fw-bold mb-1">Tổng quan hệ thống</h4>
                <p class="text-muted mb-0">Theo dõi nhanh hoạt động kinh doanh và hỗ trợ khách hàng.</p>
            </div>
            
            <div class="dashboard-stats mb-4">
                <div class="admin-card stat-card stat-border stat-success">
                    <div class="stat-content">
                        <div class="stat-text">
                            <h6>Doanh thu</h6>
                            <div class="stat-value text-success" id="stat-revenue">0 đ</div>
                        </div>
                        <div class="icon-box bg-success-subtle text-success">
                            <i class="fas fa-wallet"></i>
                        </div>
                    </div>
                </div>
                <div class="admin-card stat-card stat-border stat-warning">
                    <div class="stat-content">
                        <div class="stat-text">
                            <h6>Đơn chờ duyệt</h6>
                            <div class="stat-value text-warning" id="stat-pending">0</div>
                        </div>
                        <div class="icon-box bg-warning-subtle text-warning">
                            <i class="fas fa-clock"></i>
                        </div>
                    </div>
                </div>
                <div class="admin-card stat-card stat-border stat-primary">
                    <div class="stat-content">
                        <div class="stat-text">
                            <h6>Tổng đơn hàng</h6>
                            <div class="stat-value text-primary" id="stat-total">0</div>
                        </div>
                        <div class="icon-box bg-primary-subtle text-primary">
                            <i class="fas fa-shopping-bag"></i>
                        </div>
                    </div>
                </div>
                <div class="admin-card stat-card stat-border stat-danger cursor-pointer" onclick="window.location.href='chat.html'">
                    <div class="stat-content">
                        <div class="stat-text">
                            <h6>Hỗ trợ trực tuyến</h6>
                            <div class="stat-value text-danger">Live Chat</div>
                        </div>
                        <div class="icon-box bg-danger-subtle text-danger">
                            <i class="fab fa-facebook-messenger"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="admin-card dashboard-table-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold m-0"><i class="fas fa-history me-2 text-muted"></i>Đơn hàng mới nhất</h5>
                    <a href="orders.html" class="btn btn-sm btn-outline-primary rounded-pill px-3">Xem tất cả</a>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                            </tr>
                        </thead>
                        <tbody id="dashboard-orders">
                            <tr><td colspan="5" class="text-center text-muted py-4">Đang tải dữ liệu...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
