<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TIS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin/css/common.css">
    <link rel="stylesheet" href="admin/css/admin.css"> </head>
<body>
    <div class="main-content">
        <div class="row g-4 mb-4 mt-2">
            <div class="col-md-4">
                <div class="admin-card border-start border-success border-4 h-100">
                    <h6 class="text-muted">Doanh thu</h6><h3 class="fw-bold" id="stat-revenue">0 đ</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="admin-card border-start border-warning border-4 h-100">
                    <h6 class="text-muted">Đơn chờ duyệt</h6><h3 class="fw-bold" id="stat-pending">0</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="admin-card border-start border-primary border-4 h-100">
                    <h6 class="text-muted">Tổng đơn hàng</h6><h3 class="fw-bold" id="stat-total">0</h3>
                </div>
            </div>
        </div>
        <div class="admin-card">
            <h5 class="mb-3 fw-bold">Đơn hàng mới nhất</h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light"><tr><th>Mã</th><th>Khách hàng</th><th>Tiền</th><th>TT</th><th>Ngày</th></tr></thead>
                    <tbody id="dashboard-orders"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/admin/core.js"></script>
    <script src="../js/admin/dashboard.js"></script>
</body>
</html>
