<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài khoản - TIS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="main-content">
        <div class="content-body">
            <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
                <div>
                    <h4 class="fw-bold m-0 text-dark">Quản lý tài khoản</h4>
                    <div class="text-muted small mt-1">Theo dõi toàn bộ account, xác minh, đơn hàng và trạng thái hoạt động.</div>
                </div>
                <div class="d-flex gap-2">
                    <input type="search" class="form-control rounded-pill" id="account-search" placeholder="Tìm tên, SĐT, email..." style="width:260px">
                    <select class="form-select rounded-pill" id="account-role-filter" style="width:180px">
                        <option value="all">Tất cả vai trò</option>
                        <option value="customer">Khách hàng</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                        <option value="super_admin">Super Admin</option>
                    </select>
                </div>
            </div>

            <div class="admin-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Tài khoản</th>
                                <th>Liên hệ</th>
                                <th>Loại</th>
                                <th>Xác minh</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th class="text-end pe-4">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="accounts-list">
                            <tr><td colspan="7" class="text-center py-4">Đang tải...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="accountDetailModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Chi tiết tài khoản</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="account-detail-body"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="accountEditModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Chỉnh sửa tài khoản</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="account-edit-form">
                    <div class="modal-body">
                        <input type="hidden" id="edit-account-id">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="tel" class="form-control" id="edit-phone" inputmode="tel">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" class="form-control" id="edit-email">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Họ</label>
                                <input type="text" class="form-control" id="edit-last-name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tên</label>
                                <input type="text" class="form-control" id="edit-first-name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Loại khách hàng</label>
                                <select class="form-select" id="edit-user-type">
                                    <option value="">Chưa chọn</option>
                                    <option value="individual">Cá nhân</option>
                                    <option value="enterprise">Doanh nghiệp</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tên doanh nghiệp</label>
                                <input type="text" class="form-control" id="edit-company-name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Mã số thuế</label>
                                <input type="text" class="form-control" id="edit-tax-code">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">CCCD/CMND</label>
                                <input type="text" class="form-control" id="edit-cccd">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Địa chỉ</label>
                                <textarea class="form-control" id="edit-address" rows="3"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold"><i class="fas fa-save me-2"></i>Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/accounts.js"></script>
</body>
</html>
