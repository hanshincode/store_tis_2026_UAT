<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tu van - TIS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="main-content">
        <div class="admin-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0">Danh sach yeu cau tu van</h4>
                <button class="btn btn-primary" id="btn-open-quick-form">
                    <i class="fas fa-link me-2"></i>Tao link form nhanh
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Khach hang</th>
                            <th>Lien he</th>
                            <th>Danh muc / San pham</th>
                            <th>Nhan vien xu ly</th>
                            <th>Trang thai</th>
                            <th>Hanh dong</th>
                        </tr>
                    </thead>
                    <tbody id="consultation-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="quickFormModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Tao link form nhanh</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Danh muc can khach cap nhat</label>
                        <select id="quick-category" class="form-select"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ten khach hang (neu co)</label>
                        <input type="text" id="quick-name" class="form-control">
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">SDT goi y</label>
                            <input type="tel" id="quick-phone" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email goi y</label>
                            <input type="email" id="quick-email" class="form-control">
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label">Hieu luc link</label>
                        <select id="quick-expires-days" class="form-select">
                            <option value="7">7 ngay</option>
                            <option value="3">3 ngay</option>
                            <option value="14">14 ngay</option>
                            <option value="30">30 ngay</option>
                        </select>
                    </div>
                    <div id="quick-link-result" class="mt-3"></div>
                </div>
                <div class="modal-footer">
                    <button id="btn-create-quick-form" class="btn btn-primary">Tao link</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/consultations.js"></script>
</body>
</html>
