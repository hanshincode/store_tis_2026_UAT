<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm - TIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.min.css">
    <script src="https://cdn.ckeditor.com/ckeditor5/40.0.0/classic/ckeditor.js"></script>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="main-content">
        <div class="admin-card">
            <div class="d-flex justify-content-between mb-4">
                <h4 class="fw-bold m-0">Kho Sản phẩm</h4>
                <button class="btn btn-primary" onclick="openAddModal()">Thêm mới</button>
            </div>
            <table class="table align-middle"><thead class="table-light"><tr><th>Ảnh</th><th>Tên</th><th>NCC</th><th>Giá</th><th>Xóa</th></tr></thead><tbody id="products-list"></tbody></table>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title fw-bold">Sản phẩm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="product-form">
                        <div class="row g-3">
                            <div class="col-md-6"><label>Tên</label><input type="text" id="p-name" class="form-control"></div>
                            <div class="col-md-6"><label>Nhà cung cấp</label><input type="text" id="p-provider" class="form-control"></div>
                            <div class="col-md-4"><label>Danh mục (ID)</label><input type="number" id="p-category" class="form-control" value="1"></div>
                            <div class="col-md-4"><label>Đối tượng</label><select id="p-target" class="form-select"><option value="ind">Cá nhân</option><option value="ent">Doanh nghiệp</option></select></div>
                            <div class="col-md-4"><label>Giá (VNĐ)</label><input type="number" id="p-price" class="form-control"></div>
                            <div class="col-12"><label>Mô tả</label><textarea id="p-desc" class="form-control"></textarea></div>
                            <div class="col-12"><label>Ảnh minh họa</label><input type="file" id="p-images" class="form-control" multiple></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer"><button class="btn btn-primary" onclick="submitProduct()">Lưu</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
