<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đơn hàng - TIS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="main-content">
        <div class="content-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold m-0 text-dark">Danh sách Đơn hàng</h4>
                <div class="d-flex gap-2">
                    <button class="btn btn-danger rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#create-order-modal">
                        <i class="fas fa-plus me-2"></i>Tạo đơn cho khách
                    </button>
                    <select class="form-select rounded-pill" style="width: 220px;" onchange="loadOrders(this.value)">
                        <option value="all">Tất cả trạng thái</option>
                        <option value="awaiting_payment">Chờ thanh toán</option>
                        <option value="pending">Chờ duyệt</option>
                        <option value="confirmed">Đã xác nhận</option>
                        <option value="active">Hiệu lực</option>
                        <option value="payment_expired">Hết hạn thanh toán</option>
                        <option value="cancelled">Đã hủy</option>
                    </select>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden admin-orders-card">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Mã đơn</th>
                            <th>Khách hàng</th>
                            <th>Sản phẩm</th>
                            <th>Tổng tiền</th>
                            <th>Trạng thái</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="orders-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="create-order-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content border-0 rounded-4">
                <form id="create-order-form">
                    <div class="modal-header">
                        <div>
                            <h5 class="modal-title fw-bold">Tạo đơn cho khách hàng</h5>
                            <div class="text-muted small">Đơn sẽ được đưa vào giỏ hàng và gửi vào chat gần nhất nếu khách có phiên tư vấn.</div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-7">
                                <label class="form-label fw-semibold">Khách hàng có account</label>
                                <select class="form-select" id="create-order-customer" required>
                                    <option value="">Đang tải danh sách khách...</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-semibold">Tùy chọn</label>
                                <div class="border rounded-3 px-3 py-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="create-order-add-cart" checked>
                                        <label class="form-check-label" for="create-order-add-cart">Thêm sản phẩm vào giỏ hàng</label>
                                    </div>
                                    <div class="form-check mt-1">
                                        <input class="form-check-input" type="checkbox" id="create-order-send-chat" checked>
                                        <label class="form-check-label" for="create-order-send-chat">Gửi đơn vào chat nếu có</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label fw-semibold mb-0">Sản phẩm / gói bảo hiểm</label>
                                    <button type="button" class="btn btn-sm btn-outline-danger rounded-pill" id="btn-add-order-line">
                                        <i class="fas fa-plus me-1"></i>Thêm dòng
                                    </button>
                                </div>
                                <div id="create-order-lines" class="d-flex flex-column gap-2"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Ghi chú người thụ hưởng / yêu cầu thêm</label>
                                <textarea class="form-control" id="create-order-note" rows="3" placeholder="Ví dụ: mua cho phòng kinh doanh, danh sách nhân viên sẽ bổ sung sau..."></textarea>
                            </div>
                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center bg-light rounded-3 p-3">
                                    <div>
                                        <div class="fw-bold">Tổng tạm tính</div>
                                        <div class="text-muted small">Đơn tạo ra sẽ ở trạng thái chờ thanh toán, QR hết hạn sau 20 phút.</div>
                                    </div>
                                    <div class="h5 text-danger fw-bold mb-0" id="create-order-total">0 đ</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-danger rounded-pill px-4" id="btn-create-order">
                            <i class="fas fa-save me-2"></i>Tạo đơn
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/common.js"></script>
    <script src="js/core.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
